name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,mcp]"
      - name: Unit and integration tests (rules mode, no API keys)
        run: pytest -q
      - name: Quick end-to-end demo (stops at drafted defects; approval is a human step)
        run: python -m vagent demo --profile quick --workers 4 --reset-tracker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            runs/*/report.html
            runs/*/metrics.json
            runs/*/events.jsonl
