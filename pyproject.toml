[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vagent"
version = "0.1.0"
description = "Agentic verification workflow for an FPGA synthesis toolchain (Yosys synth_xilinx as an open-source analogue)"
requires-python = ">=3.10"
dependencies = [
  "yowasp-yosys==0.71.0.0.post1285",  # pinned: golden QoR results depend on the exact tool build
  "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0", "anthropic>=0.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["vagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=runs/pytest_tmp"
